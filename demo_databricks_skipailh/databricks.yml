# Databricks Asset Bundle (optionnel) — déploie le job et le pipeline « as code ».
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run skipailh_daily
# Sans CLI, le job se crée aussi à la main dans l'UI (voir SCENARIO_DEMO.md, étape 6).

bundle:
  name: skipailh_demo

variables:
  catalog:
    default: skipailh_demo

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<votre-workspace>.cloud.databricks.com   # à adapter (ou .azuredatabricks.net)

resources:
  jobs:
    skipailh_daily:
      name: "Skipailh - chargement quotidien"
      # Pas de cluster déclaré : les tâches tournent en Serverless
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"     # tous les jours à 6h
        timezone_id: Europe/Paris
        pause_status: PAUSED
      email_notifications:
        on_failure: []                             # ajouter votre e-mail
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: ingestion_bronze
          notebook_task:
            notebook_path: ./notebooks/01_ingestion_bronze.py
            base_parameters: { simuler_j_plus_1: "non" }
        - task_key: silver
          depends_on: [{ task_key: ingestion_bronze }]
          notebook_task:
            notebook_path: ./notebooks/02_silver_delta.py
            base_parameters: { demo_delta: "non" }
        - task_key: gold_kpis
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/03_gold_kpis.py
        - task_key: ml_scoring_attrition
          depends_on: [{ task_key: silver }]
          notebook_task:
            notebook_path: ./notebooks/04_ml_attrition_mlflow.py
          max_retries: 1

  pipelines:
    skipailh_pipeline:
      name: "Skipailh - pipeline déclaratif ventes"
      catalog: ${var.catalog}
      schema: pipeline
      serverless: true
      configuration:
        source_path: /Volumes/${var.catalog}/landing/raw
      libraries:
        - notebook:
            path: ./notebooks/07_pipeline_declaratif.py
